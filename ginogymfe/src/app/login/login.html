<div class="login-page">
  <div class="login-container">
    <h1 class="logo">AKT<span>Fit</span></h1>
    <h2>Accedi al tuo account</h2>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <input type="username" [(ngModel)]="username" name="username" placeholder="Username" required />

        <div class="form-group password-container">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password"
            placeholder="Password" required />

          <span class="toggle-password" (click)="togglePasswordVisibility()">
            <i *ngIf="!showPassword" class="fa fa-eye"></i>
            <i *ngIf="showPassword" class="fa fa-eye-slash"></i>

          </span>
        </div>
      </div>

      <button type="submit" class="btn-login">Login</button>
    </form>
    
    <p class="register-text">
      Non hai un account?
      <a routerLink="/register">Registrati</a>
    </p>
  </div>
</div>
