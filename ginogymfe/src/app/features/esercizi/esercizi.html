<div class="page-header">
  <h2>Lista Esercizi:</h2>
  <div class="insert-container">
    <button class="insert-button" (click)="goToCreate()">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>
</div>

<div class="table-container">
  <table class="table table-striped">
    <thead class="table-light">
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Nome</th>
        <th scope="col">Gruppo Muscolare</th>
        <th scope="col">Macchinario</th>
         <th scope="col" style="width: 120px;"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let esercizio of (esercizi$ | async)">
        <th scope="row">{{esercizio.id}}</th>
        <th scope="row">{{esercizio.name}}</th>
        <th scope="row">{{esercizio.muscleGroup.name}}</th>
        <th scope="row">{{esercizio.machine.name}}</th>
        <td class="action-buttons">
          <button class="Modifica" (click)="goToDetail(esercizio.id)">
            <i class="fas fa-edit"></i>
          </button>
          <button class="Dettagli" (click)="goToExerciseDetails()">Inserisci Dettagli Esercizio</button>
          <button class="Elimina" (click)="deleteEsercizio(esercizio.id)">
            <i class="fas fa-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<router-outlet></router-outlet>
