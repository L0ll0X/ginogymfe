
<div class="justify-content-beetween">
  <button class="insert-button"(click)="goToCreate()">Inserisci Nuovo Esercizio</button>
  <h2>Lista Esercizi:</h2>
</div>
<div class="table-container">
  <table class="table table-striped">
    <thead class="table-light">
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Nome</th>
        <th scope="col">Gruppo Muscolare</th>
        <th scope="col">Macchinario</th>
        <th scope="col"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let esercizio of (esercizi$ | async)">
        <th scope="row">{{esercizio.name}}</th>
        <th scope="row">{{esercizio.gruppoMuscolare}}</th>
        <th scope="row">{{esercizio.macchinario}}</th>
        <button class="Modifica" (click)="goToDetail(esercizio.id)"><i class="fas fa-edit"></i></button>
        <button class="Elimina" (click)="deleteEsercizio(esercizio.id)"><i class="fas fa-trash"></i></button>
      </tr>
    </tbody>
  </table>
</div>
