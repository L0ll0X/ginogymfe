<div class="page-header">
  <h2>Lista Esercizi:</h2>
  <div class="insert-container">
    <button class="insert-button" (click)="goToCreate()">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>
</div>

<div class="table-container">
  <table class="table table-striped">
    <thead class="table-light">
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Nome</th>
        <th scope="col">Gruppo Muscolare</th>
        <th scope="col">Macchinario</th>
        <th scope="col" style="width: 180px;"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let esercizio of (esercizi$ | async)">
        <td style="padding-inline: 10px;" data-label="Id">{{esercizio.id}}</td>
        <td style="padding-inline: 10px;" data-label="Nome">{{esercizio.name}}</td>
        <td style="padding-inline: 10px;" data-label="Gruppo Muscolare">{{esercizio.muscleGroup.name}}</td>
        <td style="padding-inline: 10px;" data-label="Macchinario">{{esercizio.machine.name}}</td>
        <td style="padding-inline: 10px;" class="action-buttons">
          <button class="button-modifica" (click)="goToDetail(esercizio.id)">
            <i class="fas fa-edit"></i>
          </button>
          <button class="button-elimina" (click)="deleteEsercizio(esercizio.id)">
            <i class="fas fa-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<div class="d-flex justify-content-between align-items-center mt-3">
  <button class="btn btn-light" (click)="paginaPrecedente()" [disabled]="currentPage === 0">← Precedente</button>
  <small>Pagina {{ currentPage + 1 }} / {{ totalPages || 1 }}</small>
  <button class="btn btn-light" (click)="paginaSuccessiva()" [disabled]="currentPage >= totalPages - 1">Successiva →</button>
</div>

<router-outlet></router-outlet>
