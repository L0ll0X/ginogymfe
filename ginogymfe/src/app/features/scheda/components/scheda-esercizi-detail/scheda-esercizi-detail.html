<div class="form-buttons mb-2 d-flex justify-content-between">
  <!-- Bottone principale per Inserisci Esercizio con stile neon (insert-button) -->
  <button type="button" class="insert-button" (click)="isCollapsed = !isCollapsed" [attr.aria-expanded]="!isCollapsed"
    aria-controls="collapseExample">
    <i [class]="getClass()"></i>
    Crea Esercizio:
  </button>

  <button type="button" class="insert-button" (click)="addNewEsercizioPanel()" >
    <!-- <i class=""></i> -->
    +
  </button>
</div>
<div #collapse="ngbCollapse" [(ngbCollapse)]="isCollapsed">
  <div class="modal-body">
    <div class="p-4 rounded-lg" style="background-color: #1a1a1a; border: 1px solid rgba(255,30,30,0.5);">
      <form #form="ngForm" *ngFor="let form of dettagliEsercizioForm">
        <div class="mt-3">
        
          <!-- Bottone per Dettagli Esercizio con stile secondario neon (back-button-style) -->
          <button type="button" class="back-button-style" (click)="isSecondCollapsed = !isSecondCollapsed"
            [attr.aria-expanded]="!isSecondCollapsed" aria-controls="collapseExample">
            <i class="fa-solid fa-angle-down"></i>
            Dettagli Esercizio:
          </button>
        </div>
        <div #collapse="ngbCollapse" [(ngbCollapse)]="isSecondCollapsed">
            <div class="row">
            <div class="col-12 col-md-6">
              <div class="input-group">
                <!-- La classe form-control è già stilata per il look dark -->
                <select id="exercise" class="form-control" name="exercise" placeholder="Scegli"
                  [(ngModel)]="esercizioIdSelected" required>
                  <option [value]="null" disabled>-- Scegli Esercizio --</option>
                  <option *ngIf="esercizi.length === 0" disabled>Non ci sono elementi</option>
                  <option *ngFor="let exercise of esercizi" [value]="exercise.id">
                    {{exercise.name}}
                  </option>
                </select>
              </div>
            </div>
          </div>
          <div class="mt-3">
            <div class="row g-3 mb-4">
              <div class="col-md-4 col-sm-12">
                <h6>Inserisci serie:</h6>
                <input type="number" class="form-control" placeholder="Serie" name="serie"
                  [(ngModel)]="form.serie" required min="1" />
                <div *ngIf="!form.serie" class="error-msg text-danger mt-1">
                  Il numero di serie è obbligatorio.
                </div>
              </div>
              <div class="col-md-4 col-sm-12">
                <h6>Inserisci ripetizioni:</h6>
                <input type="number" class="form-control" placeholder="Ripetizioni" name="ripetizioni"
                  [(ngModel)]="form.ripetizioni" required min="1" />
                <div *ngIf="!form.ripetizioni" class="error-msg text-danger mt-1">
                  Il numero di ripetizioni è obbligatorio.
                </div>
              </div>
              <div class="col-md-4 col-sm-12">
                <h6>Inserisci recupero:</h6>
                <input type="text" class="form-control" placeholder="Recupero" name="recupero"
                  [(ngModel)]="form.recupero" required />
                <div *ngIf="!form.recupero" class="error-msg text-danger mt-1">
                  La durata del recupero è obbligatoria.
                </div>
              </div>
            </div>
            <div class="mt-3 d-flex justify-content-end">
              <!--[disabled]="!form.valid "  Richiamare metodo sul ts -->
              <button type="submit" (click)="submit(form)" class="btn btn-primary btn-sm" >
                <i class="fa-solid fa-bookmark"></i> Inserisci
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
