<h2>Crea Scheda</h2>

<form #form="ngForm" (ngSubmit)="submit()">
<!-- Nominativo (Dropdown) -->
<div class="form-group">
  <label for="utente">Seleziona Utente</label>
  <select id="utente" name="utente" [(ngModel)]="scheda.userId" required
          #utenteInput="ngModel" class="form-control">
    <option value="" disabled>-- Scegli un utente --</option>
    <option *ngFor="let u of utenti" [value]="u.id">{{ u.firstName }} {{ u.lastName }}</option>
  </select>
  <div *ngIf="utenteInput.invalid && (utenteInput.dirty || utenteInput.touched)" class="text-danger">
    Selezionare un utente è obbligatorio.
  </div>
</div>


  <!-- Data Inizio -->
  <div class="form-group">
    <label for="startDate">Data Inizio</label>
    <input type="date" id="startDate" name="startDate"
           [(ngModel)]="scheda.startDate" required
           #startDateInput="ngModel" class="form-control">
  </div>

  <!-- Data Fine -->
  <div class="form-group">
    <label for="endDate">Data Fine</label>
    <input type="date" id="endDate" name="endDate"
           [(ngModel)]="scheda.endDate" required
           #endDateInput="ngModel" class="form-control">
  </div>

  <!-- Pulsanti -->
  <div class="d-flex gap-2 mt-3">
    <button type="button" class="btn btn-secondary" (click)="goBack()">
      <i class="fa-solid fa-house"></i> Torna alla Home
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="!form.valid">
      <i class="fa-solid fa-bookmark"></i> Salva
    </button>
  </div>

</form>
