<div class="page-header">
  <h2>Inserisci Scheda</h2>
</div>
<button type="button" class="btn btn-secondary btn-sm mt-3 mb-3 btn-back-small" (click)="goBack()">
  <i class="fa-solid fa-list"></i> Torna alla Lista
</button>
<form #form="ngForm">
  <!-- Data Inizio -->
  <div class="form-group">
    <div class="row g-3 mb-4">
      <div class="col-md-4 col-sm-12">
        <label for="startDate">Data Inizio</label>
        <input type="date" id="startDate" name="startDate" [(ngModel)]="scheda.startDate" required  class="form-control">
      </div>
    </div>
    <div class="form-group">
      <div class="col-md-4 col-sm-12">
        <label for="endDate">Data Fine</label>
        <input type="date" id="endDate" name="endDate" [(ngModel)]="scheda.endDate" required 
          class="form-control">
      </div>
    </div>
  </div>
  <hr class="my-4">
  <div class="mt-3">
    <app-scheda-esercizi-detail (onSchedaDetailSubmitted)="bindSchedaEsercizio($event)"></app-scheda-esercizi-detail>
  </div>
  <div class="mt-3 d-flex justify-content-end">
    <button type="submit" class="btn btn-primary" [disabled]="!form.valid" (click)="submit()">
      <i class="fa-solid fa-bookmark"></i> Salva
    </button>
  </div>
</form>
