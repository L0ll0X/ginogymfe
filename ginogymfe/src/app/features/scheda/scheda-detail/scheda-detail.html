
<h2>Aggiungi / Modifica Scheda</h2>

<form #form="ngForm" (ngSubmit)="submit()">

 <!-- Data Inizio -->
  <div class="form-group">
    <label for="startDate">Data Inizio</label>
    <input type="date" id="startDate" name="startDate"
           [(ngModel)]="scheda.startDate" required #startDateInput="ngModel" class="form-control">
    <div *ngIf="startDateInput.invalid && (startDateInput.dirty || startDateInput.touched)" class="text-danger">
      <div *ngIf="startDateInput.errors?.['required']">La data inizio è obbligatoria.</div>
    </div>
  </div>

  <!-- Data Fine -->
  <div class="form-group">
    <label for="endDate">Data Fine</label>
    <input type="date" id="endDate" name="endDate"
           [(ngModel)]="scheda.endDate" required #endDateInput="ngModel" class="form-control">
    <div *ngIf="endDateInput.invalid && (endDateInput.dirty || endDateInput.touched)" class="text-danger">
      <div *ngIf="endDateInput.errors?.['required']">La data fine è obbligatoria.</div>
    </div>
  </div>

  <!-- Pulsanti -->
  <div class="d-flex gap-2 mt-3">
    <button type="button" class="btn btn-secondary" (click)="goBack()">
      <i class="fa-solid fa-house"></i> Torna alla Home
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="!form.valid">
      <i class="fa-solid fa-bookmark"></i> Salva
    </button>
  </div>

</form>
