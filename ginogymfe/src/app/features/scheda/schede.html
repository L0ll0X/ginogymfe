<div class="page-header">
  <h2>Lista Schede:</h2>
  <div class="insert-container">
    <button class="insert-button" (click)="goToCreate()">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>
</div>

<div class="table-container">
  <table class="table table-striped">
    <thead class="table-light">
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Data Inizio</th>
        <th scope="col">Data Fine</th>
        <th scope="col" style="width: 120px;"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let s of (schede$ | async)" (click)="goToEserciziScheda(s.id)">
        <td style="padding-inline: 10px;" data-label="Id">{{s.id}}</td>
        <td style="padding-inline: 10px;" data-label="Data inizio">{{s.startDate}}</td>
        <td style="padding-inline: 10px;" data-label="Data fine">{{s.endDate}}</td>
        <td style="padding-inline: 10px;" class="action-buttons" (click)="$event.stopPropagation()">
          <button class="button-modifica" (click)="goToDetail(s.id)" (click)="$event.stopPropagation()"> 
            <i class="fas fa-edit"></i>
          </button>
          <button class="button-elimina" (click)="deleteScheda(s.id)" (click)="$event.stopPropagation()">
            <i class="fas fa-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #noData>
    <tr>
      <td colspan="4" class="text-center">Nessuna scheda presente</td>
    </tr>
  </ng-template>
</div>

<div class="d-flex justify-content-between align-items-center mt-3">
  <button class="btn btn-light" (click)="paginaPrecedente()" [disabled]="currentPage === 0">← Precedente</button>
  <small>Pagina {{ currentPage + 1 }} / {{ totalPages || 1 }}</small>
  <button class="btn btn-light" (click)="paginaSuccessiva()" [disabled]="currentPage >= totalPages - 1">Successiva →</button>
</div>
<div class="text-center mt-4">
  <button class="btn btn-secondary" (click)="tornaHome()">
    <i class="fa-solid fa-house"></i>Home
  </button>
</div>
