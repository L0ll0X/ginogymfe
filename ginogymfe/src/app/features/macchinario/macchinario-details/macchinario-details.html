<h2>Aggiungi Nuovo Macchinario:</h2>

<form #form="ngForm">
  <!-- Nome -->
  <input
    type="text"
    placeholder="Inserisci nome"
    name="name"
    [(ngModel)]="macchinario.name"
    required
    #nomeInput="ngModel"
  />

  <!-- Descrizione -->
  <input
    type="text"
    placeholder="Inserisci descrizione"
    name="description"
    [(ngModel)]="macchinario.description"
    required
    #descrizioneInput="ngModel"
  />

  <!-- Validazioni -->
  <div *ngIf="nomeInput.invalid && (nomeInput.dirty || nomeInput.touched)">
    <div *ngIf="nomeInput.errors?.['required']">Il nome è obbligatorio.</div>
  </div>

  <!-- 📸 Caricamento immagine -->
  <label for="image">Foto del macchinario</label>
  <input
    type="file"
    id="image"
    accept="image/*"
    (change)="onFileSelected($event)"
  />

  <!-- 🔍 Anteprima immagine -->
  <div *ngIf="macchinario.imageBase64" class="preview">
    <img
      [src]="macchinario.imageBase64"
      alt="Anteprima macchinario"
      width="200"
      height="200"
      style="object-fit: cover; border-radius: 8px; margin-top: 10px;"
    />
  </div>

  <!-- 🔘 Pulsanti -->
  <div class="form-buttons d-flex gap-2">
    <button type="button" class="btn-goBack" (click)="goBack()">
      <i class="fa-solid fa-list"></i> Torna alla Lista
    </button>

    <button
      type="button"
      class="btn-salva"
      [disabled]="form.invalid"
      (click)="submit()"
    >
      <i class="fa-solid fa-bookmark"></i> Salva
    </button>
  </div>
</form>
