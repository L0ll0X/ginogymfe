<div class="page-header">
  <h2>Lista Macchinari:</h2>
  <div class="insert-container">
    <button class="insert-button" (click)="goToCreate()">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>
</div>


<div class="table-container">
  <table class="table table-striped">
    <thead class="table-light">
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Nome</th>
        <th scope="col">Descrizione</th>
        <th scope="col" style="width: 120px;"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of (macchinari$ | async)">
       <td>{{ m.id }}</td>
        <td>{{ m.name }}</td>
        <td>{{ m.description }}</td>
        <td class="action-buttons">
          <button class="button-modifica" (click)="goToDetail(m.id)">
            <i class="fas fa-edit"></i>
          </button>
          <button class="button-elimina" (click)="deleteMacchinario(m.id)">
            <i class="fas fa-trash"></i>
          </button>
        </td>
      </tr>

    </tbody>
  </table>
  <ng-template #noData>
    <tr>
      <td colspan="4" class="text-center">
        Nessun macchinario presente
      </td>
    </tr>
  </ng-template>
</div>

<router-outlet></router-outlet>
