<div class="justify-content-beetween">
  <button class="insert-button"(click)="goToCreate()">Inserisci Nuovo Macchinario</button>
  <h2>Lista Macchinari:</h2>
</div>
<div class="table-container">
  <table class="table table-striped">
    <thead class="table-light">
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Nome</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let macchinario of (macchinari$ | async)">
        <th scope="row">{{macchinario.nome}}</th>
        <button class="Modifica" (click)="goToDetail(macchinario.id)"><i class="fas fa-edit"></i>Modifica</button>
      </tr>
    </tbody>
  </table>
</div>

<router-outlet></router-outlet>
