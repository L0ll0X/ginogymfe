<div class="modal-header">
  <h2 class="title">Inserisci Gruppo Muscolare</h2>
</div>

<div class="modal-body">
  <form #form="ngForm">
    <div class="mb-3">
      <div class="input-group">
        <input
          id="name"
          type="text"
          class="form-control"
          [(ngModel)]="gruppoMuscolare.name"
          name="name"
          placeholder="Inserisci..."
          required
          #description="ngModel"
        />

        <!-- Messaggio d’errore se non compilato -->
        <div *ngIf="!gruppoMuscolare.name" style="color: red;">
          Il nome del gruppo muscolare è obbligatorio.
        </div>
      </div>
    </div>

    <!-- ✅ BOTTONI DENTRO AL FORM -->
    <div class="form-buttons d-flex gap-2">
      <button type="button" class="btn-goBack" (click)="goBack()">
        <i class="fa-solid fa-list"></i> Torna alla Lista
      </button>

      <!-- Disabilitato se il form non è valido -->
      <button
        type="button"
        class="btn-salva"
        [disabled]="form.invalid"
        (click)="submit()"
      >
        <i class="fa-solid fa-bookmark"></i> Salva
      </button>
    </div>
  </form>
</div>
