<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Lista Utenti e Istruttori</h2>

  <div class="d-flex align-items-center gap-2">
    <select [(ngModel)]="ruoloFiltro" (change)="filtraPerRuolo()" class="form-select w-auto">
      <option value="Tutti">Tutti</option>
      <option value="UTENTE">Utenti</option>
      <option value="ISTRUTTORE">Istruttori</option>
      <option value="ADMIN">Admin</option>
    </select>

    <button class="btn btn-success" (click)="vaiAggiungi()">➕ Aggiungi Nuovo</button>
  </div>
</div>

<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nome</th>
      <th>Email</th>
      <th>Ruolo</th>
      <th>Azioni</th>
    </tr>
  </thead>
  <tbody>
  <tr *ngFor="let u of utentiFiltrati">
    <td>{{ u.id }}</td>
    <td>{{ u.firstName }} {{ u.lastName }}</td>
    <td>{{ u.email }}</td>
    <td>{{ u.role }}</td>
    <td class="text-end">
      <button class="btn btn-primary btn-sm me-2" (click)="vaiModifica(u.id!)">✏️ Modifica</button>
      <button class="btn btn-danger btn-sm" (click)="eliminaUtente(u.id!)">🗑️ Elimina</button>
    </td>
  </tr>

  <tr *ngIf="utentiFiltrati.length === 0">
    <td colspan="5" class="text-center">Nessun utente trovato.</td>
  </tr>
</tbody>

</table>
<div class="d-flex justify-content-between align-items-center mt-3">
  <button class="btn btn-light" (click)="paginaPrecedente()" [disabled]="currentPage === 0">← Precedente</button>
  <small>Pagina {{ currentPage + 1 }} / {{ totalPages || 1 }}</small>
  <button class="btn btn-light" (click)="paginaSuccessiva()" [disabled]="currentPage >= totalPages - 1">Successiva →</button>
</div>


<div class="text-center mt-4">
  <button class="btn btn-secondary" (click)="tornaHome()">🏠 Torna alla Home</button>
</div>
