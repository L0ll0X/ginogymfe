<div class="page-header">
  <h2>Lista Utenti e Personal Trainer</h2>
  <div class="insert-container">
    <button class="insert-button" (click)="goToCreate()">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>
</div>

<div class="table-container">
  <table class="table table-striped">
    <thead class="table-light">
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Username</th>
        <th scope="col">Email</th>
        <th scope="col">Cellulare</th>
        <th scope="col">Ruolo</th>
        <th scope="col" style="width: 120px;"></th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let u of (utenti$ | async)">
        <td>{{ u.id }}</td>
        <td>{{ u.username }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.cellulare }}</td>
        <td>{{ u.roles?.join(', ') }}</td> 
        <td class="action-buttons">
          <button class="button-modifica" (click)="goToDetail(u.id)">
            <i class="fas fa-edit"></i>
          </button>
          <button class="button-elimina" (click)="delete(u.id)">
            <i class="fas fa-trash"></i>
          </button>
        </td>
      </tr>

      <tr *ngIf="(utenti$ | async)?.length === 0">
        <td colspan="6" class="text-center">Nessun utente presente</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="text-center mt-4">
  <button class="btn btn-secondary" (click)="tornaHome()">Torna alla Home</button>
</div>
