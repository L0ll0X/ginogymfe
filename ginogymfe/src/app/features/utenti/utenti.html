<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Lista Utenti e Personal Trainer</h2>

  <div class="d-flex align-items-center gap-2">
    <!-- (change)="filtraPerRuolo()" -->
    <select [(ngModel)]="ruoloFiltro" (change)="filtraPerRuolo()" class="form-select w-auto">
      <option value="Tutti">Tutti</option>
      <option value="UTENTE">Utenti</option>
      <option value="ISTRUTTORE">Personal Trainer</option>
      <option value="ADMIN">Amministratore</option>
    </select>

    <button class="insert-button" (click)="goToCreate()">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>
</div>

<div class="table-container">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Email</th>
          <th>Ruolo</th>
          <th>Azioni</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of (utenti$| async)">
          <td data-label="ID">{{ u.id }}</td>
          <td data-label="Nome">{{ u.firstName }} {{ u.lastName }}</td>
          <td data-label="Email">{{ u.email }}</td>
          <td data-label="Ruolo">{{ u.roles }}</td>
          <td data-label="Azioni" class="text-end">
  <button class="btn btn-primary btn-sm me-2" (click)="goToDetail(u.id!)" title="Modifica">
    <i class="fa-solid fa-pen"></i>
  </button>
  <button class="btn btn-danger btn-sm" (click)="delete(u.id!)" title="Elimina">
    <i class="fa-solid fa-trash"></i>
  </button>
</td>

        </tr>

</table>
<div class="d-flex justify-content-between align-items-center mt-3">
  <button class="btn btn-light" (click)="paginaPrecedente()" [disabled]="currentPage === 0">←</button>
  <small>Pagina {{ currentPage + 1 }} di {{ totalPages }}</small>
  <button class="btn btn-light" (click)="paginaSuccessiva()" [disabled]="currentPage >= totalPages - 1">→</button>
</div>


<div class="text-center mt-4">
  <button class="btn btn-secondary" (click)="tornaHome()">🏠 Torna alla Home</button>
</div>
