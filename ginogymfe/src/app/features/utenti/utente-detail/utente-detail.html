<h2>Registrazione</h2>

<form [formGroup]="userForm" (ngSubmit)="onSubmit()">

  <div>
    <label for="name">Nome:</label>
    <input id="name" type="text" formControlName="name">
    <div *ngIf="userForm.get('name')?.invalid && userForm.get('name')?.touched" style="color: red;">
      Il nome è obbligatorio.
    </div>
  </div>

  <div>
    <label for="lastName">Cognome:</label>
    <input id="lastName" type="text" formControlName="lastName">
    <div *ngIf="userForm.get('lastName')?.invalid && userForm.get('lastName')?.touched" style="color: red;">
      Il cognome è obbligatorio.
    </div>
  </div>

  <div>
    <label for="email">Email:</label>
    <input id="email" type="email" formControlName="email">
    <div *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched" style="color: red;">
      <span *ngIf="userForm.get('email')?.errors?.['required']">L'Email è obbligatoria.</span>
      <span *ngIf="userForm.get('email')?.errors?.['email']">Inserisci un'email valida.</span>
    </div>
  </div>

  <div>
    <label for="cellulare">Cellulare:</label>
    <input id="cellulare" type="cellulare" formControlName="cellulare">
    <div *ngIf="userForm.get('cellulare')?.invalid && userForm.get('cellulare')?.touched" style="color: red;">
      <span *ngIf="userForm.get('cellulare')?.errors?.['required']">Il numero di Cellulare è obbligatorio.</span>
    </div>
  </div>

  <div>
    <label for="username">Username:</label>
    <input id="username" type="username" formControlName="username">
    <div *ngIf="userForm.get('username')?.invalid && userForm.get('username')?.touched" style="color: red;">
      <span *ngIf="userForm.get('username')?.errors?.['required']">L'username è obbligatorio.</span>
    </div>
  </div>

  <div>
    <label for="password">Password:</label>
    <input id="password" type="password" formControlName="password">
    <div *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched" style="color: red;">
      <span *ngIf="userForm.get('password')?.errors?.['required']">La password è obbligatoria.</span>
    </div>
  </div>

  <div>
  <label for="roles">Ruolo:</label>
  <div class="select-wrapper">
    <select id="roles" formControlName="roles">
      <option value="" disabled selected>Seleziona un ruolo</option>
      <option value="ADMIN">ADMIN</option>
      <option value="PT">PT</option>
      <option value="UTENTE">UTENTE</option>
    </select>
  </div>
  <div *ngIf="userForm.get('roles')?.invalid && userForm.get('roles')?.touched" style="color: red;">
    <span *ngIf="userForm.get('roles')?.errors?.['required']">Il ruolo è obbligatorio.</span>
  </div>
</div>



  <!-- <input type="hidden" formControlName="role"> -->
  <div class="form-buttons d-flex gap-2">
    <button type="submit" class="btn-registrazione" [disabled]="!userForm.valid">
      Registrati
    </button>
    <button type="button" class="btn-goBack" (click)="goBack()">
      Torna indietro
    </button>
  </div>
</form>
