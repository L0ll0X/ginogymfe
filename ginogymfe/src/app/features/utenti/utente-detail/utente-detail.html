<h2>Aggiungi Nuovo Utente</h2>

<form [formGroup]="userForm" (ngSubmit)="onSubmit()">
  
  <div>
    <label for="firstName">Nome:</label>
    <input id="firstName" type="text" formControlName="firstName">
    
    <div *ngIf="userForm.get('firstName')?.invalid && userForm.get('firstName')?.touched" style="color: red;">
      Il nome è obbligatorio.
    </div>
  </div>

  <div>
    <label for="lastName">Cognome:</label>
    <input id="lastName" type="text" formControlName="lastName">
    <div *ngIf="userForm.get('lastName')?.invalid && userForm.get('lastName')?.touched">
      Il cognome è obbligatorio.
    </div>
  </div>

  <div>
    <label for="email">Email:</label>
    <input id="email" type="email" formControlName="email">
    <div *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched">
      <span *ngIf="userForm.get('email')?.errors?.['required']">L'Email è obbligatoria.</span>
      <span *ngIf="userForm.get('email')?.errors?.['email']">Inserisci un'email valida.</span>
    </div>
  </div>

  <div>
    <label for="password">Password:</label>
    <input id="password" type="password" formControlName="password">
    <div *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched">
        <span *ngIf="userForm.get('password')?.errors?.['required']">La Password è obbligatoria.</span>
        <span *ngIf="userForm.get('password')?.errors?.['minlength']">La Password deve essere di almeno 8 caratteri.</span>
    </div>
  </div>
  
  <input type="hidden" formControlName="role">

  <button type="submit" [disabled]="userForm.invalid">
    Aggiungi Utente
  </button>
</form>
